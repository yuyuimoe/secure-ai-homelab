site_name: Secure AI Homelab
site_description: Self-hosted secure AI agent homelab — OpenShell over Pangolin with Rauthy OIDC, plus the earlier VibePod Homelab stack
site_url: https://yuyuimoe.github.io/secure-ai-homelab/
repo_name: yuyuimoe/secure-ai-homelab
repo_url: https://github.com/yuyuimoe/secure-ai-homelab
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - OpenShell + Pangolin:
      - Recipe: guides/openshell-pangolin.md
  - VibePod Homelab (previous):
      - Installation: getting-started/installation.md
      - Architecture: concepts/architecture.md
      - Security: concepts/security.md
      - PinP development: guides/pinp-development.md
      - Developer shell: guides/developer-shell.md
      - CLI reference: reference/cli.md
      - Configuration: reference/configuration.md
      - Deployment: reference/deployment.md

theme:
  name: material
  logo: assets/secure-ai-homelab-logo.svg
  favicon: assets/secure-ai-homelab-logo.svg
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy
  palette:
    scheme: slate
    primary: black
    accent: green

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
