# Rauthy — OIDC identity provider for OpenShell and Pangolin.
#
# Runs the single-container Rauthy IdP on plain HTTP behind Pangolin (which
# terminates TLS at https://<idp>). Port 8080 is bound to loopback so only the
# host-level Newt connector can reach it.
#
#   1. cp rauthy.env.example rauthy.env
#   2. fill in the secrets and your domain
#   3. podman compose up -d
#   4. podman logs -f rauthy   # copy the generated admin password (shown once)
#
# Pin the image tag deliberately; bump it when you are ready to review a release.
# See docs/guides/openshell-pangolin.md.

services:
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.1
    container_name: rauthy
    restart: unless-stopped
    env_file:
      - rauthy.env
    ports:
      # Loopback only: Newt runs at host level and forwards auth.<domain> here.
      - "127.0.0.1:8080:8080"
    volumes:
      # Rauthy stores its embedded database and generated JWKS/JWT keys here.
      # Back this up: losing it invalidates all sessions and client secrets.
      - rauthy-data:/app/data

volumes:
  rauthy-data:
