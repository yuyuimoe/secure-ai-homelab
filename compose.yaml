name: firstmate-homelab

services:
  projects-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /home/node/.firstmate/projects /home/node/.treehouse
        chown -R 1000:1000 /home/node/.firstmate/projects /home/node/.treehouse
    volumes:
      - firstmate-home:/home/node

  docker:
    image: docker:${DOCKER_VERSION:-29}-dind
    container_name: ${DIND_CONTAINER_NAME:-firstmate-dind}
    hostname: docker
    restart: unless-stopped
    privileged: true
    init: true

    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:docker,DNS:localhost

    command:
      - --storage-driver=overlay2

    depends_on:
      projects-init:
        condition: service_completed_successfully

    volumes:
      - dind-data:/var/lib/docker
      - dind-certs-ca:/certs/ca
      - dind-certs-client:/certs/client
      - type: volume
        source: firstmate-home
        target: /home/node/.firstmate/projects
        volume:
          nocopy: true
          subpath: .firstmate/projects
      - type: volume
        source: firstmate-home
        target: /home/node/.treehouse
        volume:
          nocopy: true
          subpath: .treehouse

    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  firstmate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIRSTMATE_REF: ${FIRSTMATE_REF:-main}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        DOCKER_VERSION: ${DOCKER_VERSION:-29}
    container_name: ${CONTAINER_NAME:-firstmate}
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    network_mode: "service:docker"

    depends_on:
      projects-init:
        condition: service_completed_successfully
      docker:
        condition: service_healthy

    environment:
      HOME: /home/node
      USER: node
      SHELL: /usr/bin/fish
      TERM: ${TERM:-xterm-256color}
      COLORTERM: truecolor

      FM_HOME: /home/node/.firstmate
      FM_ROOT_OVERRIDE: /opt/firstmate
      FM_BACKEND: herdr
      HERDR_SESSION: ${HERDR_SESSION:-firstmate}

      CODEX_HOME: /home/node/.codex
      NPM_CONFIG_PREFIX: /home/node/.local

      # The client talks only to the isolated DinD daemon. Because Firstmate and
      # DinD share one network namespace, project-published ports are reachable
      # from agent processes through localhost just like on a normal workstation.
      DOCKER_HOST: tcp://localhost:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client

      GIT_USER_NAME: ${GIT_USER_NAME:-Firstmate}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-firstmate@localhost}

    volumes:
      - firstmate-home:/home/node
      - dind-certs-client:/certs/client:ro

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "command -v node >/dev/null && command -v codex >/dev/null && command -v gh >/dev/null && command -v fish >/dev/null && command -v docker >/dev/null && docker info >/dev/null && git -C /opt/firstmate rev-parse --is-inside-work-tree >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    command: ["sleep", "infinity"]

volumes:
  firstmate-home:
    name: ${FIRSTMATE_HOME_VOLUME:-firstmate-homelab-home}
  dind-data:
    name: ${DIND_DATA_VOLUME:-firstmate-homelab-dind-data}
  dind-certs-ca:
    name: ${DIND_CERTS_CA_VOLUME:-firstmate-homelab-dind-certs-ca}
  dind-certs-client:
    name: ${DIND_CERTS_CLIENT_VOLUME:-firstmate-homelab-dind-certs-client}
